name: Adjust Filters

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: news-db
  cancel-in-progress: false

jobs:
  adjust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      # Пока только отчёт по оценкам: настройки не меняются, коммитить нечего (см. adjust_filters.py)
      - name: Run adjustment
        run: python adjust_filters.py
